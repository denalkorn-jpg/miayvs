<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для Дарьюшки 🍬</title>
    <style>
        /* Нежно-розовый фон */
        body {
            background-color: #ffe4e1; /* Светло-розовый (MistyRose) */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        /* Карточка по центру */
        .card {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 40px 30px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.2);
            text-align: center;
            max-width: 400px;
            width: 85%;
            z-index: 10;
            position: relative;
            border: 2px dashed #ffb6c1;
        }

        h1 {
            color: #d81b60; /* Ярко-розовый */
            font-size: 26px;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        /* Контейнер для фото (если добавите) */
        .photo-container {
            width: 100%;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(255, 182, 193, 0.4);
            display: none; /* По умолчанию скрыто. Если добавите фото, поменяйте на block */
        }

        .photo-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Розовая кнопка */
        button {
            background-color: #ff69b4; /* HotPink */
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(255, 105, 180, 0.4);
            font-family: inherit;
        }

        button:hover {
            background-color: #ff1493; /* DeepPink */
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 20px rgba(255, 105, 180, 0.6);
        }

        button:active {
            transform: translateY(1px);
        }

        /* Скрытый ответ */
        #answer-text {
            display: none;
            color: #d81b60;
            font-size: 24px;
            font-weight: bold;
            margin-top: 25px;
            line-height: 1.5;
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Плавающие стикеры */
        .sticker {
            position: absolute;
            z-index: 1;
            animation: float 5s ease-in-out infinite;
            user-select: none;
        }

        /* Позиции стикеров */
        .s1 { top: 8%; left: 10%; animation-delay: 0s; font-size: 30px; }
        .s2 { top: 15%; right: 12%; animation-delay: 1.2s; font-size: 35px; }
        .s3 { bottom: 20%; left: 15%; animation-delay: 0.7s; font-size: 25px; }
        .s4 { bottom: 12%; right: 15%; animation-delay: 2s; font-size: 32px; }
        .s5 { top: 45%; left: 4%; animation-delay: 1.5s; font-size: 28px; }
        .s6 { top: 55%; right: 5%; animation-delay: 0.3s; font-size: 26px; }
        .s7 { top: 4%; left: 45%; animation-delay: 2.5s; font-size: 24px; }
        .s8 { bottom: 4%; left: 48%; animation-delay: 1.8s; font-size: 30px; }
        .s9 { top: 30%; right: 25%; animation-delay: 0.9s; font-size: 22px; }
        .s10 { bottom: 35%; left: 30%; animation-delay: 2.2s; font-size: 27px; }

        /* Анимация парения */
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(15deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
    </style>
</head>
<body>

    <!-- Фоновые стикеры: конфетки и котики -->
    <div class="sticker s1">🍬</div>
    <div class="sticker s2">🐱</div>
    <div class="sticker s3">🍭</div>
    <div class="sticker s4">😺</div>
    <div class="sticker s5">🍬</div>
    <div class="sticker s6">🐈</div>
    <div class="sticker s7">🍬</div>
    <div class="sticker s8">😸</div>
    <div class="sticker s9">🍭</div>
    <div class="sticker s10">🐾</div>

    <!-- Основная карточка -->
    <div class="card">
        <h1>Дарьюшка, привет! Скучала? 😽</h1>
        
        <!-- Блок для фото (если захотите добавить, уберите display: none; в CSS выше и положите фото в папку) -->
        <div class="photo-container">
            <!-- <img src="photo.jpg" alt="Наше фото"> -->
        </div>

        <button id="btn" onclick="showAnswer()">Не скучай, мяу 🐾</button>
        
        <div id="answer-text">Мяу! Я тоже очень скучал(а)! ❤️🍬</div>
    </div>

    <script>
        function showAnswer() {
            // Скрываем кнопку
            var btn = document.getElementById('btn');
            btn.style.display = 'none';
            
            // Показываем текст
            var text = document.getElementById('answer-text');
            text.style.display = 'block';

            // Выпускаем немного конфетти из конфет и лапок
            createConfetti();
        }

        function createConfetti() {
            const emojis = ['🍬', '🍭', '🐾', '❤️', '😻'];
            for (let i = 0; i < 20; i++) {
                let el = document.createElement('div');
                el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                el.style.position = 'absolute';
                el.style.left = Math.random() * 100 + 'vw';
                el.style.top = '100vh';
                el.style.fontSize = (Math.random() * 20 + 15) + 'px';
                el.style.transition = 'transform 2.5s ease-out, opacity 2.5s';
                el.style.zIndex = 100;
                document.body.appendChild(el);

                // Анимация поднятия вверх
                setTimeout(() => {
                    el.style.transform = `translateY(-${window.innerHeight}px) rotate(${Math.random() * 360}deg)`;
                    el.style.opacity = 0;
                }, 50);

                // Удаление элемента
                setTimeout(() => {
                    el.remove();
                }, 2500);
            }
        }
    </script>
</body>
</html>
