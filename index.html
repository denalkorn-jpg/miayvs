    <script>
        const btn = document.getElementById('showCongratsBtn');
        const congratsScreen = document.getElementById('congratsScreen');

        // SVG-код для глаголической буквы "И" (Ⰻ). 
        // Он будет отображаться везде, даже без специальных шрифтов.
        const glagoliticSVG = `
            <svg viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
                <path d="M 25 5 L 10 45 M 25 5 L 40 45 M 10 25 L 40 25" 
                      stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </svg>
        `;

        function fireGlagoliticSalute() {
            const colors = ['#ffd700', '#d32f2f', '#1a237e', '#ffffff', '#e53935'];
            const particleCount = 120;

            for (let i = 0; i < particleCount; i++) {
                setTimeout(() => {
                    const particle = document.createElement('div');
                    particle.classList.add('glagolitic-particle');
                    
                    // Вставляем SVG-картинку внутрь контейнера
                    particle.innerHTML = glagoliticSVG;
                    
                    // Применяем цвет через CSS (stroke="currentColor" возьмет этот цвет)
                    particle.style.color = colors[Math.floor(Math.random() * colors.length)];
                    
                    // Случайный размер
                    const randomSize = Math.random() * 30 + 25; // от 25 до 55 px
                    particle.style.width = `${randomSize}px`;
                    particle.style.height = `${randomSize}px`;
                    particle.style.fontSize = `${randomSize}px`; // на всякий случай
                    
                    // Стартовая сторона (левая или правая)
                    const isLeft = Math.random() > 0.5;
                    const startX = isLeft ? 0 : window.innerWidth;
                    const startY = window.innerHeight; 
                    
                    particle.style.left = `${startX}px`;
                    particle.style.top = `${startY}px`;
                    
                    document.body.appendChild(particle);

                    // Физика выстрела
                    const angleDeg = isLeft 
                        ? (Math.random() * 45 + 15) 
                        : (Math.random() * 45 + 120);
                    
                    const rad = angleDeg * Math.PI / 180;
                    const velocity = Math.random() * 350 + 300; 
                    
                    const tx = Math.cos(rad) * velocity;
                    const ty = -Math.sin(rad) * velocity; 

                    // Анимация
                    particle.animate([
                        { 
                            transform: `translate(0, 0) scale(0.2) rotate(0deg)`, 
                            opacity: 0 
                        },
                        { 
                            transform: `translate(${tx}px, ${ty}px) scale(1.2) rotate(15deg)`, 
                            opacity: 1,
                            offset: 0.4 
                        },
                        { 
                            transform: `translate(${tx + (isLeft ? 80 : -80)}px, ${ty + 600}px) scale(0.8) rotate(-15deg)`, 
                            opacity: 0 
                        }
                    ], {
                        duration: Math.random() * 1500 + 2000,
                        easing: 'cubic-bezier(0.2, 0.8, 0.4, 1)', 
                        fill: 'forwards'
                    });

                    setTimeout(() => particle.remove(), 4000);
                }, i * 15);
            }
        }

        btn.addEventListener('click', () => {
            congratsScreen.classList.add('active');
            fireGlagoliticSalute();
        });
    </script>
