<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поздравление директору ИСл РАН</title>
    <!-- Подключаем шрифт для рукописных надписей -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f1ea; /* Слегка кремовый фон */
            font-family: 'Times New Roman', serif;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Контейнер для логотипа */
        .header {
            text-align: center;
            padding: 20px;
            width: 100%;
            background: #2c3e2e; /* Цвет в тон обложке книги */
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .header img {
            max-height: 80px;
            border-radius: 5px;
        }

        /* Основная зона с фотографиями */
        .collage-container {
            position: relative;
            width: 100%;
            max-width: 1400px; 
            height: 900px; 
            margin-top: 20px;
        }

        .photo-wrapper {
            position: absolute;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            border: 5px solid #fff;
            background: #fff;
            transition: transform 0.3s ease;
        }
        
        .photo-wrapper:hover {
            transform: scale(1.05) rotate(0deg) !important;
            z-index: 10;
        }

        .photo-wrapper img {
            display: block;
            max-width: 100%;
            height: auto;
        }

        /* Позиционирование фото */
        .photo-book {
            top: 50px;
            left: 50px;
            width: 300px;
            transform: rotate(-5deg);
        }

        .photo-ded {
            top: 50px;
            right: 50px;
            width: 400px;
            transform: rotate(4deg);
        }

        .photo-portrait {
            top: 350px;
            left: 350px;
            width: 250px;
            transform: rotate(-3deg);
        }

        /* Рукописные надписи */
        .handwritten-text {
            font-family: 'Caveat', cursive;
            font-size: 34px;
            color: #1a1a1a;
            position: absolute;
            z-index: 5;
            line-height: 1.1;
            text-shadow: 2px 2px 0px #fff, -2px -2px 0px #fff, 2px -2px 0px #fff, -2px 2px 0px #fff; 
        }

        .text-ded {
            top: 30px;
            right: 480px;
            transform: rotate(-8deg);
            text-align: right;
            width: 300px;
        }

        .text-book {
            bottom: -80px;
            left: 50px;
            transform: rotate(-3deg);
            width: 350px;
        }

        .text-portrait {
            top: 450px;
            left: 630px;
            transform: rotate(5deg);
            width: 300px;
            color: #8b0000; 
        }

        /* SVG стрелочки */
        .arrow {
            position: absolute;
            z-index: 4;
            pointer-events: none;
        }

        .arrow path {
            fill: none;
            stroke: #2c3e2e; 
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: drawArrow 2s ease-in-out forwards;
        }

        @keyframes drawArrow {
            to { stroke-dashoffset: 0; }
        }

        .arrow-book { top: 200px; left: 380px; width: 150px; height: 100px; }
        .arrow-ded { top: 180px; right: 480px; width: 150px; height: 100px; }
        .arrow-portrait { top: 320px; left: 620px; width: 120px; height: 100px; }

        /* Кнопка */
        .btn-container {
            margin: 40px 0;
            z-index: 20;
        }

        .main-btn {
            background-color: #8b0000; 
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 24px;
            font-family: 'Times New Roman', serif;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: background 0.3s, transform 0.1s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .main-btn:hover {
            background-color: #a00000;
        }
        
        .main-btn:active {
            transform: scale(0.95);
        }

        /* Скрытый контент поздравления */
        .congrats-container {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 100;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .congrats-container.active {
            display: flex;
            opacity: 1;
        }

        .congrats-title {
            font-family: 'Caveat', cursive;
            font-size: 120px;
            color: #ffd700;
            margin: 0 0 30px 0;
            text-shadow: 2px 2px 10px rgba(255,215,0,0.5);
            transform: scale(0);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .congrats-container.active .congrats-title {
            transform: scale(1);
        }

        .final-photo {
            width: 600px;
            max-width: 90%;
            border: 8px solid #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transform: translateY(50px);
            opacity: 0;
            transition: all 0.8s ease 0.3s;
        }

        .congrats-container.active .final-photo {
            transform: translateY(0);
            opacity: 1;
        }

    </style>
</head>
<body>

    <div class="header">
        <!-- Логотип в формате JPG -->
        <img src="logo.jpg" alt="Логотип ИСл РАН">
    </div>

    <div class="collage-container">
        <!-- 1. Фото с книгой (JPG) -->
        <div class="photo-wrapper photo-book">
            <img src="book.jpg" alt="Книга">
        </div>
        
        <!-- Стрелочка к книге -->
        <svg class="arrow arrow-book" viewBox="0 0 150 100">
            <path d="M 10 90 Q 50 10 140 40 M 120 20 L 140 40 L 110 60" />
        </svg>

        <!-- Текст для книги -->
        <div class="handwritten-text text-book">
            Желаем много-много монографий<br>(и времени на их создание)
        </div>

        <!-- 2. Фото с дедом (JPG) -->
        <div class="photo-wrapper photo-ded">
            <img src="ded.jpg" alt="Дедушка">
        </div>

        <!-- Стрелочка к деду -->
        <svg class="arrow arrow-ded" viewBox="0 0 150 100">
            <path d="M 140 90 Q 100 10 10 40 M 30 20 L 10 40 L 40 60" />
        </svg>

        <!-- Текст для деда -->
        <div class="handwritten-text text-ded">
            Желаю больше замечательных информантов
        </div>

        <!-- 3. Фото-портрет (JPG) -->
        <div class="photo-wrapper photo-portrait">
            <img src="portrait.jpg" alt="Портрет">
        </div>
        
        <!-- Стрелочка к портрету -->
        <svg class="arrow arrow-portrait" viewBox="0 0 100 100">
            <path d="M 10 10 Q 60 10 80 80 M 60 70 L 80 80 L 90 60" />
        </svg>

        <!-- Текст для портрета -->
        <div class="handwritten-text text-portrait">
            Успехов в полевых исследованиях и новых открытий!
        </div>
    </div>

    <div class="btn-container">
        <button class="main-btn" id="showCongratsBtn">Получить поздравления</button>
    </div>

    <!-- Оверлей с поздравлением и фото с тортом -->
    <div class="congrats-container" id="congratsScreen">
        <h1 class="congrats-title">Поздравляем!</h1>
        <!-- Фото с тортом в формате PNG -->
        <img src="cake.png" alt="Торт" class="final-photo">
    </div>

    <!-- Подключаем библиотеку для хлопушек -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <script>
        const btn = document.getElementById('showCongratsBtn');
        const congratsScreen = document.getElementById('congratsScreen');

        // Функция запуска хлопушек с двух сторон
        function fireConfetti() {
            // Левая сторона
            confetti({
                particleCount: 150,
                spread: 80,
                origin: { x: 0, y: 0.6 },
                angle: 60,
                colors: ['#ffd700', '#8b0000', '#ffffff', '#2c3e2e']
            });
            // Правая сторона
            confetti({
                particleCount: 150,
                spread: 80,
                origin: { x: 1, y: 0.6 },
                angle: 120,
                colors: ['#ffd700', '#8b0000', '#ffffff', '#2c3e2e']
            });
        }

        btn.addEventListener('click', () => {
            congratsScreen.classList.add('active');
            fireConfetti();
            
            // Дополнительный залп для красоты
            setTimeout(() => {
                confetti({
                    particleCount: 100,
                    spread: 120,
                    origin: { y: 0.4 }
                });
            }, 600);
        });
    </script>
</body>
</html>
