<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поздравление директору ИСл РАН</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #fcf9f2; /* Светлый кремовый фон */
            font-family: 'Times New Roman', serif;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Контейнер для логотипа */
        .header {
            text-align: center;
            padding: 20px;
            width: 100%;
            background: #4a151b; /* Благородный бордовый */
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border-bottom: 3px solid #d4af37; /* Золотая полоса */
        }
        .header img {
            max-height: 80px;
            border-radius: 5px;
            background: white; /* На случай, если лого прозрачное */
            padding: 5px;
        }

        /* Основная зона с фотографиями */
        .collage-container {
            position: relative;
            width: 100%;
            max-width: 1200px; 
            height: 850px; 
            margin-top: 30px;
        }

        .photo-wrapper {
            position: absolute;
            box-shadow: 0 12px 25px rgba(0,0,0,0.25);
            border: 6px solid #fff;
            background: #fff;
            transition: transform 0.3s ease;
        }
        
        .photo-wrapper:hover {
            transform: scale(1.03) rotate(0deg) !important;
            z-index: 10;
        }

        .photo-wrapper img {
            display: block;
            max-width: 100%;
            height: auto;
        }

        /* Позиционирование фото */
        .photo-book {
            top: 20px;
            left: 50px;
            width: 320px;
            transform: rotate(-4deg);
        }

        .photo-ded {
            top: 40px;
            right: 50px;
            width: 450px;
            transform: rotate(3deg);
        }

        .photo-portrait {
            top: 380px;
            left: 400px;
            width: 280px;
            transform: rotate(-2deg);
        }

        /* Рукописные надписи */
        .handwritten-text {
            font-family: 'Caveat', cursive;
            font-size: 36px;
            color: #4a151b; /* Темно-бордовый текст */
            position: absolute;
            z-index: 5;
            line-height: 1.1;
            text-shadow: 2px 2px 0px #fff, -2px -2px 0px #fff, 2px -2px 0px #fff, -2px 2px 0px #fff; 
        }

        .text-ded {
            top: 120px;
            right: 520px;
            transform: rotate(-6deg);
            text-align: right;
            width: 300px;
        }

        .text-book {
            top: 380px;
            left: 50px;
            transform: rotate(-3deg);
            width: 350px;
            font-size: 32px;
        }

        .text-portrait {
            top: 500px;
            left: 710px;
            transform: rotate(4deg);
            width: 350px;
            color: #b8860b; /* Золотисто-коричневый */
        }

        /* Рукописные стрелочки (SVG) */
        .arrow {
            position: absolute;
            z-index: 4;
            pointer-events: none;
            overflow: visible;
        }

        .arrow path {
            fill: none;
            stroke: #b8860b; /* Золотая стрелка */
            stroke-width: 3.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: drawArrow 2s ease-in-out forwards;
        }

        @keyframes drawArrow {
            to { stroke-dashoffset: 0; }
        }

        .arrow-ded { top: 200px; right: 500px; width: 180px; height: 120px; }
        .arrow-book { top: 300px; left: 350px; width: 180px; height: 120px; }
        .arrow-portrait { top: 400px; left: 680px; width: 150px; height: 120px; }

        /* Кнопка */
        .btn-container {
            margin: 40px 0;
            z-index: 20;
        }

        .main-btn {
            background-color: #8b0000; /* Насыщенный красный */
            color: #fff;
            border: 3px solid #d4af37; /* Золотая окантовка */
            padding: 18px 50px;
            font-size: 26px;
            font-family: 'Times New Roman', serif;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(139,0,0,0.4);
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .main-btn:hover {
            background-color: #a00000;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(139,0,0,0.6);
        }
        
        .main-btn:active {
            transform: scale(0.95) translateY(0);
        }

        /* Оверлей с поздравлением */
        .congrats-container {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(20, 5, 5, 0.95); /* Темный фон */
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .congrats-container.active {
            display: flex;
            opacity: 1;
        }

        .congrats-title {
            font-family: 'Caveat', cursive;
            font-size: 140px;
            color: #ffd700; /* Золотой */
            margin: 0 0 30px 0;
            text-shadow: 3px 3px 15px rgba(255,215,0,0.6);
            transform: scale(0) rotate(-10deg);
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .congrats-container.active .congrats-title {
            transform: scale(1) rotate(0deg);
        }

        .final-photo {
            width: 650px;
            max-width: 90%;
            border: 8px solid #fff;
            box-shadow: 0 15px 40px rgba(0,0,0,0.7);
            transform: translateY(50px);
            opacity: 0;
            transition: all 0.8s ease 0.3s;
        }

        .congrats-container.active .final-photo {
            transform: translateY(0);
            opacity: 1;
        }

        /* Конфетти (создается через JS) */
        .confetti-piece {
            position: fixed;
            width: 12px;
            height: 12px;
            z-index: 999;
            pointer-events: none;
            top: -20px;
        }
    </style>
</head>
<body>

    <div class="header">
        <!-- Если логотип в формате JPG, замените на logo.jpg -->
        <img src="logo.png" alt="Логотип ИСл РАН">
    </div>

    <div class="collage-container">
        <!-- 1. Фото с книгой -->
        <div class="photo-wrapper photo-book">
            <img src="book.jpg" alt="Книга">
        </div>
        
        <!-- Текст для книги -->
        <div class="handwritten-text text-book">
            Желаем много-много монографий<br>(и времени на их создание)
        </div>
        
        <!-- Стрелочка к книге -->
        <svg class="arrow arrow-book" viewBox="0 0 200 120">
            <path d="M 20 100 Q 80 30 180 60 M 150 40 L 180 60 L 150 80" />
        </svg>

        <!-- 2. Фото с дедом -->
        <div class="photo-wrapper photo-ded">
            <img src="ded.jpg" alt="Дедушка">
        </div>

        <!-- Текст для деда -->
        <div class="handwritten-text text-ded">
            Желаю больше замечательных информантов
        </div>

        <!-- Стрелочка к деду -->
        <svg class="arrow arrow-ded" viewBox="0 0 200 120">
            <path d="M 180 100 Q 120 30 20 60 M 50 40 L 20 60 L 50 80" />
        </svg>

        <!-- 3. Фото-портрет -->
        <div class="photo-wrapper photo-portrait">
            <img src="portrait.jpg" alt="Портрет">
        </div>
        
        <!-- Текст для портрета -->
        <div class="handwritten-text text-portrait">
            Успехов в полевых исследованиях!
        </div>

        <!-- Стрелочка к портрету -->
        <svg class="arrow arrow-portrait" viewBox="0 0 150 120">
            <path d="M 20 20 Q 70 30 120 100 M 100 90 L 120 100 L 130 80" />
        </svg>
    </div>

    <div class="btn-container">
        <button class="main-btn" id="showCongratsBtn">Получить поздравления</button>
    </div>

    <!-- Оверлей с поздравлением -->
    <div class="congrats-container" id="congratsScreen">
        <h1 class="congrats-title">Поздравляем!</h1>
        <img src="cake.png" alt="Торт" class="final-photo">
    </div>

    <script>
        const btn = document.getElementById('showCongratsBtn');
        const congratsScreen = document.getElementById('congratsScreen');

        // Встроенная функция для создания хлопушек (работает без внешних библиотек)
        function fireConfettiFromSides() {
            const colors = ['#ffd700', '#8b0000', '#ffffff', '#d4af37', '#fcf9f2'];
            
            // Создаем 80 конфетти
            for (let i = 0; i < 80; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.classList.add('confetti-piece');
                    
                    // Случайный цвет
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    
                    // Определяем сторону (левая или правая)
                    const isLeft = Math.random() > 0.5;
                    
                    // Позиция
                    confetti.style.left = isLeft ? '0' : '100vw';
                    confetti.style.top = Math.random() * 50 + 50 + 'vh'; // От середины до низа
                    
                    // Форма (круг или квадрат)
                    if(Math.random() > 0.5) confetti.style.borderRadius = '50%';
                    else confetti.style.width = '8px'; // Прямоугольники

                    document.body.appendChild(confetti);

                    // Физика полета
                    const angle = isLeft ? (Math.random() * 45 + 15) : (Math.random() * 45 + 120); // Углы в градусах
                    const velocity = Math.random() * 250 + 150; // Скорость
                    
                    const rad = angle * Math.PI / 180;
                    const tx = Math.cos(rad) * velocity;
                    const ty = -Math.sin(rad) * velocity + 300; // Притяжение вниз

                    // Анимация
                    confetti.animate([
                        { transform: `translate(0, 0) rotate(0deg)`, opacity: 1 },
                        { transform: `translate(${tx}px, ${ty}px) rotate(${Math.random() * 720}deg)`, opacity: 0 }
                    ], {
                        duration: Math.random() * 1500 + 1500,
                        easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)'
                    });

                    // Удаляем элемент после завершения
                    setTimeout(() => confetti.remove(), 3000);
                }, i * 15); // Задержка между вылетами
            }
        }

        btn.addEventListener('click', () => {
            congratsScreen.classList.add('active');
            fireConfettiFromSides();
        });
    </script>
</body>
</html>
